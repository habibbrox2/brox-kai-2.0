name: Cloudflare Provider Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "composeApp/**"
      - "docs/providers/cloudflare-workers-ai.md"
      - ".github/workflows/cloudflare-provider-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-provider-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  common-tests-and-android-build:
    name: Common tests and Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run shared and desktop tests
        run: ./gradlew :composeApp:desktopTest --stacktrace

      - name: Build Android Foss debug variant
        run: ./gradlew :androidApp:assembleFossDebug --stacktrace
