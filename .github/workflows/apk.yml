name: Build APK (Debug/Test Only)

# On-demand Foss APK build via the Actions tab (Run workflow).
# WARNING: This builds a DEBUG-SIGNED APK for testing only.
# DO NOT use for updates over release-signed installations.
# For release builds, use the release.yml workflow with signing secrets.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  apk:
    name: Generate Foss Debug/Test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android Build Tools
        run: sdkmanager "build-tools;36.0.0"
      - name: Build Foss Debug APK (NOT FOR UPDATES)
        run: bash ./gradlew :androidApp:assembleFossDebug --stacktrace
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: brox-kai-foss-debug-test-apk
          path: androidApp/build/outputs/apk/foss/debug/*.apk
