name: Auto Release

# Brox Kai 2.0 — automatic release pipeline.
# On every push to main:
#   1. Bump the next v2.0.x version (patch +1 over the latest v2.0.* tag),
#      update gradle/libs.versions.toml (appVersion + versionCode), commit and tag.
#   2. Build the Foss APK, Windows x64 MSI and Windows x64 zip from that tag.
#   3. Publish a GitHub Release named "Brox Kai 2.0 v<version>" — "Brox Kai 2.0"
#      is the fixed brand name, only the 2.0.x version changes per release.
# The bump commit is pushed with the workflow GITHUB_TOKEN, which does not
# retrigger workflows, so there is no release loop.
# Production APK releases require the configured production keystore. Missing or invalid signing secrets fail before version bump/tag creation.

on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  signing-preflight:
    name: Validate production Android signing
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      ENFORCE_RELEASE_SIGNING: "true"
    steps:
      - name: Validate signing secrets and keystore
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEY_ALIAS KEYSTORE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required production signing secret ${name} is not configured."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/brox-kai-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Production signing keystore and alias validated."

  bump:
    name: Bump version and tag
    needs: signing-preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump version, commit and tag
        id: bump
        run: |
          set -euo pipefail
          LATEST=$(git tag --list 'v2.0.*' --sort=-v:refname | grep -E '^v2\.0\.[0-9]+$' | head -n1)
          if [ -z "$LATEST" ]; then
            echo "::error::No v2.0.* tag found — cannot derive the next Brox Kai 2.0 version"
            exit 1
          fi
          PATCH="${LATEST#v2.0.}"
          PATCH="${PATCH%%[^0-9]*}"
          VERSION="2.0.$((PATCH + 1))"
          sed -i "s/^appVersion = .*/appVersion = \"${VERSION}\"/" gradle/libs.versions.toml
          CODE=$(grep -oP 'android-versionCode = "\K[0-9]+' gradle/libs.versions.toml)
          NEW_CODE=$((CODE + 1))
          sed -i "s/^android-versionCode = .*/android-versionCode = \"${NEW_CODE}\"/" gradle/libs.versions.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/libs.versions.toml
          git commit -m "chore(release): v${VERSION}"
          git pull --rebase origin main
          git tag -f "v${VERSION}"
          git push origin HEAD:main "v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Released v${VERSION} (versionCode ${NEW_CODE})"

  apk:
    name: Build APK
    needs: bump
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump.outputs.version }}
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android Build Tools
        run: |
          yes | sdkmanager "build-tools;37.0.0"
          yes | sdkmanager "build-tools;36.0.0"
          yes | sdkmanager "ndk;29.0.14206865"
      - name: Configure production signing keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/brox-kai-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build production-signed Foss APK
        run: ./gradlew :androidApp:assembleFossRelease --stacktrace
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="androidApp/build/outputs/apk/foss/release/androidApp-foss-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"
          CERT_SHA256=$(sed -nE 's/.*certificate SHA-256 digest: ([0-9a-fA-F:]+).*/\1/p' "$RUNNER_TEMP/apk-signature.txt" | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          VERSION="${{ needs.bump.outputs.version }}"
          VERSION_CODE=$(grep -oP 'android-versionCode = "\K[0-9]+' gradle/libs.versions.toml)
          ASSET_NAME="Brox-Kai-2.0-v${VERSION}-Android.apk"
          python3 - "$VERSION" "$VERSION_CODE" "$ASSET_NAME" "$APK_SHA256" "$CERT_SHA256" <<'PY'
          import json, sys
          version, version_code, asset_name, sha256, cert_sha256 = sys.argv[1:]
          manifest = {
              "schemaVersion": 1,
              "packageName": "com.inspiredandroid.kai",
              "versionName": version,
              "versionCode": int(version_code),
              "assetName": asset_name,
              "downloadUrl": f"https://github.com/habibbrox2/brox-kai-2.0/releases/download/v{version}/{asset_name}",
              "sha256": sha256,
              "signerCertificateSha256": cert_sha256,
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\\n")
          PY
          test -s update.json
          cat update.json
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-package
          path: androidApp/build/outputs/apk/foss/release/androidApp-foss-release.apk
      - name: Upload update manifest
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: update.json

  windows:
    name: Build MSI and Zip
    needs: bump
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump.outputs.version }}
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install WiX Toolset
        run: choco install wixtoolset -y --no-progress
      - name: Build MSI
        run: ./gradlew packageReleaseMsi --stacktrace
      - name: Build distributable
        run: ./gradlew createReleaseDistributable --stacktrace
      - name: Create zip
        run: |
          Compress-Archive -Path "composeApp/build/compose/binaries/main-release/app/Kai/*" -DestinationPath "Brox-Kai-2.0-v${{ needs.bump.outputs.version }}-Windows-x64.zip"
      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-package
          path: composeApp/build/compose/binaries/main-release/msi/*.msi
      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zip-package
          path: Brox-Kai-*-Windows-x64.zip

  release:
    name: Publish GitHub Release
    needs: [bump, apk, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump.outputs.version }}
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Rename assets to Brox Kai branding
        run: |
          set -euo pipefail
          # "Brox Kai 2.0" is the fixed brand name; only the version (2.0.x) changes per release
          VERSION="${{ needs.bump.outputs.version }}"
          cd dist
          if [ -f androidApp-foss-release.apk ]; then
            mv androidApp-foss-release.apk "Brox-Kai-2.0-v${VERSION}-Android.apk"
          else
            echo "::error::Expected signed APK artifact androidApp-foss-release.apk is missing."
            exit 1
          fi
          test -s update.json
          mv *.msi "Brox-Kai-2.0-v${VERSION}-Windows-x64.msi"
          ls -la
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Brox Kai 2.0 v${{ needs.bump.outputs.version }}
          tag_name: v${{ needs.bump.outputs.version }}
          generate_release_notes: true
          files: |
            dist/Brox-Kai-*
