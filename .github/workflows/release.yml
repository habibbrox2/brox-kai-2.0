name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  signing-preflight:
    name: Validate production Android signing
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - name: Validate signing secrets and keystore
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEY_ALIAS KEYSTORE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required production signing secret ${name} is not configured."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/brox-kai-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

  apk:
    name: Generate APK
    needs: signing-preflight
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      ENFORCE_RELEASE_SIGNING: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;36.0.0"
          sdkmanager "build-tools;29.0.3"
      - name: Configure production signing keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/brox-kai-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build production-signed APK
        run: bash ./gradlew :androidApp:assembleFossRelease --stacktrace
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="androidApp/build/outputs/apk/foss/release/androidApp-foss-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"
          CERT_SHA256=$(sed -nE 's/.*certificate SHA-256 digest: ([0-9a-fA-F:]+).*/\1/p' "$RUNNER_TEMP/apk-signature.txt" | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION_CODE=$(grep -oP 'android-versionCode = "\K[0-9]+' gradle/libs.versions.toml)
          ASSET_NAME="Brox-Kai-2.0-v${VERSION}-Android.apk"
          python3 - "$VERSION" "$VERSION_CODE" "$ASSET_NAME" "$APK_SHA256" "$CERT_SHA256" <<'PY'
          import json, sys
          version, version_code, asset_name, sha256, cert_sha256 = sys.argv[1:]
          manifest = {
              "schemaVersion": 1,
              "packageName": "com.inspiredandroid.kai",
              "versionName": version,
              "versionCode": int(version_code),
              "assetName": asset_name,
              "downloadUrl": f"https://github.com/habibbrox2/brox-kai-2.0/releases/download/v{version}/{asset_name}",
              "sha256": sha256,
              "signerCertificateSha256": cert_sha256,
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          test -s update.json
          python3 - "$VERSION" "$VERSION_CODE" "$ASSET_NAME" <<'PY'
          import json, re, sys
          version, version_code, asset_name = sys.argv[1:]
          with open("update.json", encoding="utf-8") as f:
              m = json.load(f)
          expected_url = f"https://github.com/habibbrox2/brox-kai-2.0/releases/download/v{version}/{asset_name}"
          assert m.get("schemaVersion") == 1, "Invalid manifest schemaVersion"
          assert m.get("packageName") == "com.inspiredandroid.kai", "Invalid packageName"
          assert m.get("versionName") == version, "Manifest versionName mismatch"
          assert m.get("versionCode") == int(version_code) and int(version_code) > 0, "Invalid versionCode"
          assert m.get("assetName") == asset_name, "Manifest assetName mismatch"
          assert m.get("downloadUrl") == expected_url, "Manifest downloadUrl mismatch"
          assert re.fullmatch(r"[a-f0-9]{64}", m.get("sha256", "")), "Invalid APK SHA-256"
          assert re.fullmatch(r"[a-f0-9]{64}", m.get("signerCertificateSha256", "")), "Invalid signer SHA-256"
          PY
          cat update.json
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: androidApp/build/outputs/apk/foss/release/androidApp-foss-release.apk
      - name: Upload update manifest
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: update.json

  dmg:
    name: Generate DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Build DMG
        run: bash ./gradlew packageReleaseDmg --stacktrace
      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-package
          path: composeApp/build/compose/binaries/main-release/dmg/*.dmg

  msi:
    name: Generate MSI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build MSI
        run: ./gradlew packageReleaseMsi --stacktrace
      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-package
          path: composeApp/build/compose/binaries/main-release/msi/*.msi

  deb:
    name: Generate DEB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Build DEB
        run: ./gradlew packageReleaseDeb --stacktrace
      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: composeApp/build/compose/binaries/main-release/deb/*.deb

  rpm:
    name: Generate RPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Install RPM build tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build RPM
        run: ./gradlew packageReleaseRpm --stacktrace
      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: composeApp/build/compose/binaries/main-release/rpm/*.rpm

  linux-tar:
    name: Generate Linux Tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Build application distribution
        run: ./gradlew createReleaseDistributable --stacktrace
      - name: Create tarball
        run: |
          cd composeApp/build/compose/binaries/main-release/app
          tar czf "$GITHUB_WORKSPACE/Kai-linux-x86_64.tar.gz" Kai
      - name: Upload Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar-package
          path: Kai-linux-x86_64.tar.gz

  appimage:
    name: Generate AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Install AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
      - name: Build application distribution
        run: ./gradlew createReleaseDistributable --stacktrace
      - name: Create AppDir structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Copy distributable contents
          cp -r composeApp/build/compose/binaries/main-release/app/Kai/* AppDir/usr/lib/

          # Copy icon
          cp composeApp/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/kai.png
          cp composeApp/icon.png AppDir/kai.png

          # Create desktop file
          cat > AppDir/kai.desktop << 'EOF'
          [Desktop Entry]
          Name=Kai
          Comment=AI Assistant Application
          Exec=kai
          Icon=kai
          Type=Application
          Categories=Utility;
          Terminal=false
          EOF
          cp AppDir/kai.desktop AppDir/usr/share/applications/

          # Create AppRun
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/lib/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib/lib/runtime/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/lib/bin/Kai" "$@"
          EOF
          chmod +x AppDir/AppRun
      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir Kai-x86_64.AppImage
      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-package
          path: Kai-*.AppImage

  flatpak:
    name: Generate Flatpak
    needs: [linux-tar]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Download Linux Tarball
        uses: actions/download-artifact@v4.1.7
        with:
          name: linux-tar-package
      - name: Install Flatpak and Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
      - name: Build Flatpak
        run: |
          # Copy tarball to flatpak dir and compute sha256
          cp Kai-linux-x86_64.tar.gz flatpak/
          SHA256=$(sha256sum Kai-linux-x86_64.tar.gz | cut -d' ' -f1)

          # Patch manifest to use local tarball instead of URL
          cd flatpak
          sed -i "s|url: https://github.com/SimonSchubert/Kai/releases/download/.*|path: Kai-linux-x86_64.tar.gz|" io.github.simonschubert.Kai.yaml
          sed -i "s|sha256: .*|sha256: ${SHA256}|" io.github.simonschubert.Kai.yaml

          # Build and bundle
          flatpak-builder --repo=repo --force-clean build-dir io.github.simonschubert.Kai.yaml
          flatpak build-bundle repo ../Kai.flatpak io.github.simonschubert.Kai
      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-package
          path: Kai.flatpak

  play-store:
    name: Upload AAB to Play Store
    uses: ./.github/workflows/play-store.yml
    with:
      ref: ${{ github.ref }}
    secrets: inherit

  release:
    name: Release APK, DMG, MSI, DEB, RPM, AppImage, Flatpak and Tarball
    needs: [apk, dmg, msi, deb, rpm, appimage, linux-tar, flatpak]
    if: always() && needs.apk.result == 'success' && needs.dmg.result == 'success' && needs.msi.result == 'success' && needs.deb.result == 'success' && needs.rpm.result == 'success' && needs.appimage.result == 'success' && needs.linux-tar.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download APK Artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: signed-apk
      - name: Download update manifest
        uses: actions/download-artifact@v4.1.7
        with:
          name: update-manifest

      - name: Download DMG Artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: dmg-package

      - name: Download MSI Artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: msi-package

      - name: Download DEB Artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: deb-package

      - name: Download RPM Artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: rpm-package

      - name: Download AppImage Artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: appimage-package

      - name: Download Linux Tarball Artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: linux-tar-package

      - name: Download Flatpak Artifact
        if: needs.flatpak.result == 'success'
        uses: actions/download-artifact@v4.1.7
        with:
          name: flatpak-package

      - name: List downloaded files (for debugging)
        run: ls -la

      - name: Rename assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv androidApp-foss-release.apk "Brox-Kai-2.0-v${VERSION}-Android.apk"
          test -s update.json
          mv *.dmg "Kai-${VERSION}-macos.dmg"
          mv *.msi "Kai-${VERSION}-windows.msi"
          mv *.deb "Kai-${VERSION}-linux.deb"
          mv *.rpm "Kai-${VERSION}-linux.rpm"
          mv *.AppImage "Kai-${VERSION}-linux.AppImage"
          mv Kai-linux-x86_64.tar.gz "Kai-${VERSION}-linux-x86_64.tar.gz"
          if [ -f Kai.flatpak ]; then mv Kai.flatpak "Kai-${VERSION}-linux.flatpak"; fi

      - name: Extract changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            sed -n "/^## v${VERSION}/,/^## v/{ /^## v${VERSION}/d; /^## v/d; p; }" CHANGELOG.md > changelog.txt
          fi
          # Fallback if CHANGELOG.md missing or section empty
          if [ ! -s changelog.txt ]; then
            PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -n1)
            if [ -z "$PREVIOUS_TAG" ]; then
              git log --pretty=format:"- %s" "${GITHUB_REF_NAME}" > changelog.txt
            else
              git log --pretty=format:"- %s" "${PREVIOUS_TAG}..${GITHUB_REF_NAME}" --no-merges > changelog.txt
            fi
          fi

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          if ! ls Kai-* 1>/dev/null 2>&1; then
            echo "::error::No release artifacts found matching Kai-*"
            exit 1
          fi
          sha256sum Kai-* > SHA256SUMS
          echo "=== Generated checksums ==="
          cat SHA256SUMS

      - name: Verify checksums
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS

      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: changelog.txt
          files: |
            Kai-*
            Brox-Kai-2.0-v*-Android.apk
            update.json
            SHA256SUMS

      - name: Publish canonical update.json to main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API_PATH="repos/habibbrox2/brox-kai-2.0/contents/update.json"
          CURRENT=$(gh api "$API_PATH?ref=main" 2>/dev/null || true)
          if [ -n "$CURRENT" ]; then
            CURRENT_CODE=$(printf '%s' "$CURRENT" | jq -r '.content' | tr -d '\n' | base64 --decode | python3 -c 'import json,sys; print(int(json.load(sys.stdin)["versionCode"]))')
            CANDIDATE_CODE=$(python3 -c 'import json; print(int(json.load(open("update.json"))["versionCode"]))')
            if [ "$CURRENT_CODE" -ge "$CANDIDATE_CODE" ]; then
              echo "Keeping canonical main manifest versionCode $CURRENT_CODE; candidate $CANDIDATE_CODE is not newer."
              exit 0
            fi
            EXISTING_SHA=$(printf '%s' "$CURRENT" | jq -r '.sha')
          else
            EXISTING_SHA=""
          fi
          CONTENT=$(base64 -w 0 update.json)
          ARGS=(--method PUT "$API_PATH"
            -f message="[skip ci] chore(update): publish ${GITHUB_REF_NAME} manifest"
            -f content="$CONTENT"
            -f branch=main)
          if [ -n "$EXISTING_SHA" ]; then ARGS+=(-f sha="$EXISTING_SHA"); fi
          gh api "${ARGS[@]}"
          echo "Published canonical update.json for ${GITHUB_REF_NAME}"

      - name: Sync winget-pkgs fork
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: gh repo sync SimonSchubert/winget-pkgs --source microsoft/winget-pkgs --branch master --force

      - name: Publish to WinGet
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: SimonSchubert.Kai
          installers-regex: '\.msi$'
          token: ${{ secrets.WINGET_TOKEN }}