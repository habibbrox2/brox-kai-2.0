name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    # Bot-authored PR commits must still be tested. Suppress only bot-triggered
    # push runs (the workflow's own generated commit) to avoid CI loops.
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      (github.event_name != 'push' || github.actor != 'github-actions[bot]')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: Check if fork PR
        id: fork-check
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "is_fork=true" >> $GITHUB_OUTPUT
          else
            echo "is_fork=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Verify Java version
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version

      - name: Run spotlessApply
        run: ./gradlew spotlessApply --no-daemon --stacktrace

      - name: Run updateScreenshots
        run: ./gradlew :screenshotTests:updateScreenshots --no-daemon --stacktrace

      - name: Install cwebp
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convert site images to WebP
        run: ./scripts/convert-site-images-to-webp.sh

      - name: Run desktop tests
        run: ./gradlew :composeApp:desktopTest --no-daemon --stacktrace

      - name: Compile Android FOSS debug and run unit tests
        run: ./gradlew :androidApp:compileFossDebugKotlin :androidApp:testFossDebugUnitTest --no-daemon --stacktrace

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Capture generated changes for review
        if: |
          github.event_name == 'pull_request' &&
          steps.changes.outputs.has_changes == 'true'
        run: |
          git status --short > generated-changes-status.txt
          git diff --binary > generated-changes.patch
          git diff --stat > generated-changes-stat.txt
          git diff --name-only -z | xargs -0 tar -czf generated-files.tar.gz --
          echo "Captured generated changes and exact file contents for review."

      - name: Upload generated changes for review
        if: always() && github.event_name == 'pull_request' && steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-changes-review-${{ github.run_id }}
          path: |
            generated-changes-status.txt
            generated-changes-stat.txt
            generated-changes.patch
            generated-files.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Commit reviewed generated source changes to PR branch
        if: |
          github.event_name == 'pull_request' &&
          steps.fork-check.outputs.is_fork == 'false' &&
          steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Drop binary assets already verified as pixel-identical.
          git restore -- \
            screenshots/mobile-1.png \
            screenshots/mobile-2.png \
            screenshots/mobile-3.png \
            screenshots/mobile-4.png \
            screenshots/mobile-5.png \
            screenshots/mobile-7.png \
            site/img/ecopulse-light.webp \
            site/img/gemma-local-chat.webp \
            site/img/gemma-local-context-slider.webp \
            site/img/gemma-local-download.webp \
            site/img/gemma-local-model-card.webp \
            site/img/gemma-local-select.webp \
            site/img/gemma-local-settings.webp \
            site/img/recipe-light.webp

          git add -- \
            androidApp/src/main/kotlin/com/inspiredandroid/kai/MainActivity.kt \
            androidApp/src/main/kotlin/com/inspiredandroid/kai/updater/AndroidApkSignatureVerifier.kt \
            androidApp/src/main/kotlin/com/inspiredandroid/kai/updater/AndroidUpdateDownloadWorker.kt \
            androidApp/src/main/kotlin/com/inspiredandroid/kai/updater/AndroidUpdateInstaller.kt \
            androidApp/src/main/kotlin/com/inspiredandroid/kai/updater/AndroidUpdateSettingsSection.kt \
            androidApp/src/main/kotlin/com/inspiredandroid/kai/updater/AndroidUpdateApkPathValidation.kt \
            androidApp/src/test/kotlin/com/inspiredandroid/kai/updater/AndroidUpdateApkPathValidationTest.kt \
            composeApp/src/commonMain/kotlin/com/inspiredandroid/kai/App.kt \
            composeApp/src/commonMain/kotlin/com/inspiredandroid/kai/ui/settings/SettingsScreen.kt \
            composeApp/src/commonMain/kotlin/com/inspiredandroid/kai/ui/settings/SettingsDetailPane.kt \
            composeApp/src/commonMain/kotlin/com/inspiredandroid/kai/ui/settings/GeneralSettings.kt \
            composeApp/src/commonMain/kotlin/com/inspiredandroid/kai/updater/AndroidUpdateDiscovery.kt \
            composeApp/src/commonMain/kotlin/com/inspiredandroid/kai/updater/AndroidUpdateDownloadRequestValidation.kt \
            composeApp/src/commonTest/kotlin/com/inspiredandroid/kai/updater/AndroidUpdateDownloadRequestValidationTest.kt \
            composeApp/src/commonTest/kotlin/com/inspiredandroid/kai/updater/AndroidUpdateDiscoveryTest.kt \
            composeApp/src/commonMain/kotlin/com/inspiredandroid/kai/updater/AndroidApkVersionValidation.kt \
            composeApp/src/commonTest/kotlin/com/inspiredandroid/kai/updater/AndroidApkVersionValidationTest.kt \
            androidApp/build.gradle.kts \
            gradle/libs.versions.toml \
            composeApp/src/commonMain/kotlin/com/inspiredandroid/kai/updater/AndroidApkIdentityValidation.kt \
            composeApp/src/commonTest/kotlin/com/inspiredandroid/kai/updater/AndroidApkIdentityValidationTest.kt \
            composeApp/src/androidMain/kotlin/com/inspiredandroid/kai/Platform.android.kt \
            composeApp/src/commonMain/kotlin/com/inspiredandroid/kai/data/AppSettings.kt \
            composeApp/src/commonMain/kotlin/com/inspiredandroid/kai/data/RemoteDataRepository.kt \
            composeApp/src/commonMain/kotlin/com/inspiredandroid/kai/data/ToolPermissionManager.kt \
            composeApp/src/commonMain/kotlin/com/inspiredandroid/kai/network/CloudflareModelSearchParser.kt \
            composeApp/src/commonMain/kotlin/com/inspiredandroid/kai/ui/Theme.kt \
            composeApp/src/commonMain/kotlin/com/inspiredandroid/kai/ui/chat/ChatTimelineData.kt \
            composeApp/src/commonMain/kotlin/com/inspiredandroid/kai/ui/chat/ChatUiState.kt \
            composeApp/src/commonMain/kotlin/com/inspiredandroid/kai/ui/chat/activities/ActivityMapper.kt \
            composeApp/src/commonMain/kotlin/com/inspiredandroid/kai/ui/chat/composables/BotMessage.kt \
            composeApp/src/commonMain/kotlin/com/inspiredandroid/kai/ui/chat/composables/ChatTimeline.kt \
            composeApp/src/commonMain/kotlin/com/inspiredandroid/kai/ui/chat/composables/ToolConfirmationCard.kt \
            composeApp/src/commonMain/kotlin/com/inspiredandroid/kai/ui/settings/GeneralSettings.kt \
            iosApp/Configuration/Config.xcconfig

          if git diff --cached --quiet; then
            echo "No reviewed source changes to commit."
            exit 0
          fi

          git commit -m "chore: apply reviewed formatting and version sync"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Fail if unreviewed generated changes remain
        if: github.event_name == 'pull_request'
        run: |
          # Review artifacts are temporary workspace files, not repository changes.
          rm -f generated-changes-status.txt generated-changes-stat.txt generated-changes.patch generated-files.tar.gz
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Unreviewed generated changes remain after the allowlisted commit."
            git status --short
            exit 1
          fi

      - name: Commit and push changes
        if: |
          steps.changes.outputs.has_changes == 'true' &&
          github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "Auto-fix: spotlessApply and updateScreenshots [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      # Preserve XML failure messages and HTML stack traces even when a test task fails.
      - name: Upload screenshot test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-test-reports-${{ github.run_id }}
          path: |
            screenshotTests/build/test-results/testDebugUnitTest/
            screenshotTests/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
