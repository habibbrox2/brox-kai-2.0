name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      github.actor != 'github-actions[bot]'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: Check if fork PR
        id: fork-check
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "is_fork=true" >> $GITHUB_OUTPUT
          else
            echo "is_fork=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Verify Java version
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version

      - name: Run spotlessApply
        run: ./gradlew spotlessApply --no-daemon --stacktrace

      - name: Run updateScreenshots
        run: ./gradlew :screenshotTests:updateScreenshots --no-daemon --stacktrace

      - name: Install cwebp
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convert site images to WebP
        run: ./scripts/convert-site-images-to-webp.sh

      - name: Run desktop tests
        run: ./gradlew :composeApp:desktopTest --no-daemon --stacktrace

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Fail if pull request has generated changes
        if: |
          github.event_name == 'pull_request' &&
          steps.changes.outputs.has_changes == 'true'
        run: |
          echo "::error::This pull request requires formatting or generated asset updates."
          echo "Generated/modified files:"
          git status --short
          echo "Diff summary:"
          git diff --stat
          echo "Please commit the generated results to the PR branch."
          exit 1

      - name: Commit and push changes
        if: |
          steps.changes.outputs.has_changes == 'true' &&
          github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "Auto-fix: spotlessApply and updateScreenshots [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      # Preserve XML failure messages and HTML stack traces even when a test task fails.
      - name: Upload screenshot test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-test-reports-${{ github.run_id }}
          path: |
            screenshotTests/build/test-results/testDebugUnitTest/
            screenshotTests/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
